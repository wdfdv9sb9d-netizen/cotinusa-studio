ackground:#45262c;border:1px solid #d45b65;border-radius:13px;padding:15px;color:#ffe2e2}.alert b{color:#ffc0c0}.notice{padding:14px;border-radius:12px;background:#194653;border:1px solid #407d88;color:#d4eeef;line-height:1.5;font-size:13px}.ticket{padding:17px}.ticket h3{margin:0 0 9px}.ticket p{margin:8px 0}.tables{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.tables button{min-height:66px;border:1px solid #45808b;background:#1b4c59;color:white;border-radius:12px;font-weight:800}.tables button.active{background:#ff705b;color:#102b38;border-color:#ff705b}.scroll{overflow:auto}.data-table{width:100%;border-collapse:collapse;min-width:450px}.data-table th,.data-table td{text-align:left;border-bottom:1px solid #36606a;padding:12px}.data-table th{color:#b6cfd2;font-size:12px}.empty{text-align:center;color:#b1c8cd;padding:30px}.mobile{display:none}@media(max-width:1080px){.app{grid-template-columns:165px minmax(0,1fr)}.main{padding:17px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.app{display:block;padding-bottom:76px}.side{display:none}.main{padding:14px}.top{align-items:flex-start}.chip{font-size:10px}.two{grid-template-columns:1fr}.products{grid-template-columns:repeat(2,minmax(0,1fr))}.tables{grid-template-columns:repeat(4,1fr)}.mobile{display:grid;position:fixed;bottom:0;left:0;right:0;grid-template-columns:repeat(5,1fr);background:#0c2330;border-top:1px solid #376b76;z-index:20}.mobile button{border:0;background:transparent;color:#e1f1f1;min-height:70px;font-size:11px}.mobile button.active{background:#176b78;color:#fff}}

'use strict';
const DEMO=[{id:'d1',name:'Hamburguesa clásica',price:8.5,category:'Hamburguesas',available:true},{id:'d2',name:'Hamburguesa doble',price:11.9,category:'Hamburguesas',available:true},{id:'d3',name:'Patatas fritas',price:3.5,category:'Complementos',available:true},{id:'d4',name:'Refresco',price:2,category:'Bebidas',available:true},{id:'d5',name:'Menú hamburguesa',price:12.5,category:'Menús',available:true}];
const demoOrders=[{id:'DEMO-001',name:'Cliente de muestra',type:'Mesa',table:1,items:[{name:'Menú hamburguesa',qty:1,price:12.5}],total:12.5,status:'Pendiente',allergy:false,details:''}];
const S={page:'home',category:'Todos',service:'Mesa',table:1,customer:'',address:'',notes:'',allergy:false,allergyDetails:'',cart:{},orders:demoOrders,filter:'Activos',notice:'',connection:{url:'',key:'',token:'',restaurant:'0bfa5b0f-c9f5-443f-a766-64835e09a605',menu:[],orders:[],status:'Sin conectar: la aplicación utiliza una carta de demostración.',error:false,loading:false}};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const eur=n=>Number(n||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'});const menu=()=>S.connection.token?S.connection.menu:DEMO;const nav=[['home','⌂','Inicio'],['tpv','▦','TPV'],['tables','▧','Mesas'],['kitchen','▤','Cocina'],['voice','◉','Voice AI'],['allergies','⚠','Alérgenos'],['connect','⇄','Supabase']];const pageNames={home:'Panel del restaurante',tpv:'TPV táctil',tables:'Plano de sala y mesas',kitchen:'Pantalla de cocina',voice:'PATRON Voice AI',allergies:'Seguridad alimentaria',connect:'Conexión Supabase'};
function go(p){S.page=p;S.notice='';render()}function setCategory(v){S.category=v;render()}function setService(v){S.service=v;render()}function setTable(n){S.table=n;render()}function setFilter(v){S.filter=v;render()}function setField(k,v){S[k]=v}function toggleAllergy(v){S.allergy=v;render()}
function add(id){S.cart[id]=(S.cart[id]||0)+1;render()}function change(id,d){S.cart[id]=Math.max(0,(S.cart[id]||0)+d);render()}function cartLines(){return menu().filter(p=>(S.cart[p.id]||0)>0).map(p=>({...p,qty:S.cart[p.id]}))}function cartTotal(){return cartLines().reduce((a,p)=>a+p.qty*Number(p.price),0)}function clearCart(){S.cart={};S.customer='';S.address='';S.notes='';S.allergy=false;S.allergyDetails='';render()}
function makeOrder(){const lines=cartLines();if(!lines.length)return;if(S.service==='Domicilio'&&!S.address.trim()){S.notice='Introduce la dirección de entrega antes de continuar.';render();return}if(S.allergy&&!S.allergyDetails.trim()){S.notice='Describe la alergia para registrar la solicitud de revisión.';render();return}const order={id:'DEMO-'+String(Math.max(1,...S.orders.map(o=>Number(o.id.split('-')[1])||0))+1).padStart(3,'0'),name:S.customer.trim()||'Cliente de prueba',type:S.service,table:S.service==='Mesa'?S.table:null,address:S.service==='Domicilio'?S.address.trim():'',notes:S.notes.trim(),items:lines.map(p=>({name:p.name,qty:p.qty,price:Number(p.price)})),total:cartTotal(),status:S.allergy?'Revisión de alérgenos':'Pendiente',allergy:S.allergy,details:S.allergyDetails.trim()};S.orders.unshift(order);clearCart();S.notice=order.allergy?'Solicitud simulada retenida: NO enviada a cocina. Pendiente de revisión humana.':'Comanda simulada enviada a cocina. No se ha guardado en Supabase.';S.page=order.allergy?'allergies':'kitchen';render()}
function advance(id){const o=S.orders.find(o=>o.id===id);if(!o||o.allergy)return;const seq=['Pendiente','Preparando','Listo','Entregado'];const i=seq.indexOf(o.status);if(i>=0&&i<3)o.status=seq[i+1];render()}
function stat(t,v){return `<div class="stat"><small>${esc(t)}</small><strong>${esc(v)}</strong></div>`}function ticket(o){const blocked=o.allergy;return `<article class="ticket"><div class="row between"><h3>${esc(o.id)}</h3><span class="tag ${blocked?'red':o.status==='Entregado'?'green':''}">${esc(o.status)}</span></div><p class="sub">${esc(o.name)} · ${esc(o.type)}${o.table?' '+o.table:''}</p>${o.items.map(i=>`<p>${Number(i.qty)} × ${esc(i.name)}</p>`).join('')}<div class="line"><strong>${eur(o.total)}</strong>${blocked?'<strong style="color:#ffc0c0">⚠ ALERGIA</strong>':''}</div>${o.notes?`<p class="sub">Nota: ${esc(o.notes)}</p>`:''}${blocked?`<div class="alert"><b>REVISIÓN PENDIENTE · NO PREPARAR</b><p>${esc(o.details)}</p><p>No existe comprobación de ingredientes ni contacto cruzado. Solicitud no confirmada.</p></div>`:o.status==='Entregado'?'<span class="tag green">Finalizado</span>':`<button class="btn alt sm" onclick="advance('${esc(o.id)}')">Avanzar estado →</button>`}</article>`}
function tpv(){const items=menu();const categories=['Todos',...new Set(items.map(p=>p.category||'Otros'))];return `<div class="grid"><section class="panel"><h2>Selecciona productos ${S.connection.token?'<span class="tag green">Carta real · lectura</span>':'<span class="tag">Carta demo</span>'}</h2><div class="tabs">${categories.map(c=>`<button class="${S.category===c?'active':''}" onclick="setCategory('${esc(c).replace(/'/g,'&#39;')}')">${esc(c)}</button>`).join('')}</div><div class="products">${items.filter(p=>S.category==='Todos'||(p.category||'Otros')===S.category).filter(p=>p.available!==false).map(p=>`<button class="tile" onclick="add('${esc(p.id)}')"><b>＋ ${esc(p.name)}</b><span class="price">${eur(p.price)}</span></button>`).join('')||'<div class="empty">Sin productos en esta categoría</div>'}</div><p class="sub">Los precios se muestran según la carta seleccionada. Los pedidos continúan siendo de demostración.</p></section><section class="panel"><h2>Nueva comanda</h2><div class="tabs">${['Mesa','Recogida','Domicilio'].map(t=>`<button class="${S.service===t?'active':''}" onclick="setService('${t}')">${t}</button>`).join('')}</div>${S.service==='Mesa'?`<p class="sub">Selecciona una de las 20 mesas</p><div class="tables">${Array.from({length:20},(_,i)=>`<button class="${S.table===i+1?'active':''}" onclick="setTable(${i+1})">${i+1}</button>`).join('')}</div>`:''}<div class="two" style="margin:15px 0"><label class="field">Nombre / referencia<input value="${esc(S.customer)}" oninput="setField('customer',this.value)" placeholder="Opcional"></label>${S.service==='Domicilio'?`<label class="field">Dirección de entrega<input value="${esc(S.address)}" oninput="setField('address',this.value)" placeholder="Obligatoria"></label>`:'<div></div>'}</div><h2>Productos de la comanda</h2>${cartLines().length?cartLines().map(p=>`<div class="line"><div><b>${esc(p.name)}</b><div class="sub">${eur(p.price)} / ud.</div></div><div class="qty"><button aria-label="Quitar uno" onclick="change('${esc(p.id)}',-1)">−</button><b>${p.qty}</b><button aria-label="Añadir uno" onclick="change('${esc(p.id)}',1)">+</button></div></div>`).join(''):'<div class="empty">Pulsa los productos para añadirlos</div>'}<label class="field" style="margin-top:14px">Observaciones<textarea oninput="setField('notes',this.value)" placeholder="Sin inventar ingredientes ni condiciones">${esc(S.notes)}</textarea></label><div class="alert" style="margin-top:13px"><label class="row"><input type="checkbox" style="width:23px;height:23px;accent-color:#ff705b" ${S.allergy?'checked':''} onchange="toggleAllergy(this.checked)"><b>El cliente declara una alergia alimentaria</b></label>${S.allergy?`<label class="field" style="margin-top:10px">Alergia comunicada<textarea oninput="setField('allergyDetails',this.value)" placeholder="Ej. frutos secos">${esc(S.allergyDetails)}</textarea></label><p class="sub">Esta solicitud quedará RETENIDA y NO aparecerá en cocina.</p>`:''}</div><div class="total"><span>Total</span><span class="price">${eur(cartTotal())}</span></div><div class="row"><button class="btn" ${!cartLines().length?'disabled':''} onclick="makeOrder()">${S.allergy?'Retener solicitud de prueba':'Enviar comanda de prueba'}</button><button class="btn alt" onclick="clearCart()">Vaciar</button></div><p class="sub">Sin cobros, llamadas ni escrituras en Supabase.</p></section></div>`}
function kitchen(){let list=S.orders.filter(o=>!o.allergy);if(S.filter==='Activos')list=list.filter(o=>o.status!=='Entregado');if(S.filter==='Finalizados')list=list.filter(o=>o.status==='Entregado');return `<section class="panel"><h2>Comandas táctiles · DEMO</h2><div class="tabs">${['Activos','Todos','Finalizados'].map(f=>`<button class="${S.filter===f?'active':''}" onclick="setFilter('${f}')">${f}</button>`).join('')}</div><p class="sub">Las solicitudes con alergia pendiente están excluidas de cocina. Las comandas reales no se modifican.</p><div class="stack">${list.map(ticket).join('')||'<div class="empty">No hay comandas en este filtro</div>'}</div></section>`}
function allergyView(){const a=S.orders.filter(o=>o.allergy);return `<section class="panel"><h2>Alertas prioritarias · DEMO</h2><div class="alert"><b>⚠ NO PREPARAR SIN VERIFICACIÓN HUMANA</b><p>La aplicación no puede garantizar ausencia de alérgenos ni contacto cruzado. No hay botón para aprobar automáticamente una solicitud.</p></div><div class="stack" style="margin-top:14px">${a.map(ticket).join('')||'<div class="empty">Sin solicitudes de prueba retenidas</div>'}</div><p class="sub">La autorización real de revisiones, su trazabilidad y el bloqueo en servidor deben validarse antes de poner el sistema en producción.</p></section>`}
function voice(){return `<div class="grid"><section class="panel"><h2>Recepcionista telefónico IA</h2><span class="tag">SIMULACIÓN · SIN LÍNEA REAL</span><div class="ticket" style="margin-top:14px"><h3>Solicitud telefónica de Javier</h3><p>1 × Menú hamburguesa · Coca-Cola solicitada</p><p>Consumo en local · Llegada prevista 14:00 · Precio base ${eur(12.5)}</p><div class="alert"><b>⚠ ALERGIA A FRUTOS SECOS</b><p>El cliente prefiere consultar la seguridad del menú al llegar. No se ha avisado al restaurante ni confirmado el pedido.</p></div><p class="sub">Esta ficha es una representación de la conversación anterior; no procede de una llamada ni de Supabase.</p></div></section><section class="panel"><h2>Estado del módulo</h2><div class="line">Guion conversacional <span class="tag green">Simulado</span></div><div class="line">Número telefónico <span class="tag">Pendiente</span></div><div class="line">Voz y transcripción <span class="tag">Pendiente</span></div><div class="line">Creación de pedidos reales <span class="tag">Desactivada</span></div></section></div>`}
function home(){return `<div class="stats">${stat('Comandas demo',S.orders.length)}${stat('En cocina',S.orders.filter(o=>!o.allergy&&o.status!=='Entregado').length)}${stat('Alertas pendientes',S.orders.filter(o=>o.allergy).length)}${stat('Mesas configuradas','20')}</div><div class="grid"><section class="panel"><h2>Actividad reciente</h2><div class="stack">${S.orders.slice(0,5).map(ticket).join('')}</div></section><section class="panel"><h2>Accesos táctiles</h2><div class="stack"><button class="btn" onclick="go('tpv')">＋ Nueva comanda</button><button class="btn alt" onclick="go('kitchen')">▤ Pantalla de cocina</button><button class="btn alt" onclick="go('allergies')">⚠ Seguridad alimentaria</button><button class="btn alt" onclick="go('connect')">⇄ Datos Supabase</button></div><div class="notice" style="margin-top:15px">Versión de demostración: TPV y cocina no guardan pedidos. La conexión Supabase es de solo lectura.</div></section></div>`}
function connectView(){const C=S.connection;return `<section class="panel"><h2>Supabase · conexión de solo lectura</h2><p class="sub">Conecta mediante la URL del proyecto, una clave pública publishable/anon y un usuario de Supabase Auth. Nunca introduzcas service_role ni secret. La sesión permanece solo en memoria y no se guarda en archivos.</p><div class="two"><label class="field">URL del proyecto<input id="sb-url" value="${esc(C.url)}" placeholder="https://xxxx.supabase.co" autocomplete="off"></label><label class="field">Clave pública<input id="sb-key" value="${esc(C.key)}" placeholder="sb_publishable_..." autocomplete="off"></label><label class="field">Correo de Supabase Auth<input id="sb-email" type="email" autocomplete="username" placeholder="usuario@restaurante.es"></label><label class="field">Contraseña de Supabase Auth<input id="sb-pass" type="password" autocomplete="current-password" placeholder="Contraseña"></label></div><div class="row" style="margin-top:15px"><button class="btn" ${C.loading?'disabled':''} onclick="connectReadOnly()">${C.loading?'Conectando…':'Conectar y leer datos'}</button><button class="btn alt" onclick="disconnect()">Desconectar</button></div><div class="notice" style="margin-top:14px">${esc(C.status)}</div><p class="sub">Al conectarse, el TPV mostrará los productos reales, pero las comandas seguirán siendo locales y simuladas. La app realiza login y lecturas GET; no ejecuta INSERT, UPDATE ni DELETE.</p></section>${C.token?`<section class="panel" style="margin-top:15px"><div class="stats" style="grid-template-columns:repeat(2,1fr)">${stat('Productos reales',C.menu.length)}${stat('Pedidos visibles',C.orders.length)}</div><h2>Carta real</h2><div class="scroll"><table class="data-table"><thead><tr><th>Producto</th><th>Categoría</th><th>Precio</th></tr></thead><tbody>${C.menu.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td>${eur(p.price)}</td></tr>`).join('')||'<tr><td colspan="3">No hay productos visibles</td></tr>'}</tbody></table></div><h2 style="margin-top:20px">Pedidos reales (solo lectura)</h2><div class="scroll"><table class="data-table"><thead><tr><th>Nº</th><th>Estado</th><th>Total</th><th>Alergia</th></tr></thead><tbody>${C.orders.map(o=>`<tr><td>${esc(o.order_number)}</td><td>${esc(o.status)}</td><td>${eur(o.total)}</td><td>${o.allergy_alert?'⚠ Revisar':'—'}</td></tr>`).join('')||'<tr><td colspan="4">No hay pedidos visibles</td></tr>'}</tbody></table></div></section>`:''}`}
async function connectReadOnly(){const C=S.connection;const url=document.getElementById('sb-url').value.trim().replace(/\/$/,'');const key=document.getElementById('sb-key').value.trim();const email=document.getElementById('sb-email').value.trim();const password=document.getElementById('sb-pass').value;C.url=url;C.key=key;C.token='';C.menu=[];C.orders=[];S.cart={};if(!/^https:\/\/[a-z0-9.-]+\.supabase\.co$/i.test(url)||!key||!email||!password){C.status='Revisa URL, clave pública, correo y contraseña.';C.error=true;render();return}if(/service_role|sb_secret_/i.test(key)){C.status='No utilices una clave privada en el navegador.';C.error=true;render();return}C.loading=true;C.status='Autenticando…';render();try{const a=await fetch(url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({email,password})});const d=await a.json();if(!a.ok||!d.access_token)throw Error(d.error_description||d.msg||d.message||'Error de autenticación');C.token=d.access_token;const headers={apikey:key,Authorization:'Bearer '+C.token};const base=encodeURIComponent(C.restaurant);const [m,o]=await Promise.all([fetch(url+'/rest/v1/menu_items?select=id,name,category,price,available&restaurant_id=eq.'+base+'&limit=200',{headers}),fetch(url+'/rest/v1/orders?select=order_number,status,total,allergy_alert&restaurant_id=eq.'+base+'&order=created_at.desc&limit=50',{headers})]);if(!m.ok||!o.ok)throw Error('Lectura denegada: '+(await (!m.ok?m:o).text()).slice(0,180));C.menu=(await m.json()).map(p=>({...p,price:Number(p.price)}));C.orders=await o.json();C.status='Conectado en solo lectura. El TPV utiliza ahora la carta real. Las comandas siguen siendo simuladas.';C.error=false;S.category='Todos'}catch(e){C.token='';C.menu=[];C.orders=[];C.status='Error de conexión: '+e.message;C.error=true}finally{C.loading=false;render()}}
function disconnect(){const C=S.connection;C.token='';C.key='';C.menu=[];C.orders=[];C.status='Desconectado. Carta demo restaurada. Sin cambios en Supabase.';S.cart={};S.category='Todos';render()}
function render(){const active=nav.map(([id,ic,t])=>`<button class="${S.page===id?'active':''}" onclick="go('${id}')">${ic} &nbsp; ${t}</button>`).join('');const views={home,tpv,tables:tablesView,kitchen,voice,allergies:allergyView,connect:connectView};document.getElementById('app').innerHTML=`<div class="app"><aside class="side"><div class="brand">PATRON<small>FOOD AI · TABLET V5</small></div><div class="nav">${active}</div><div class="hint">20 MESAS · RECOGIDA · DOMICILIO<br>TPV y cocina: DEMO<br>Supabase: SOLO LECTURA</div></aside><main class="main"><header class="top"><div><div class="eyebrow">PATRON / RESTAURANTE DEMO</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin:9px 0"><a href="/showroom" style="color:#fff;border:1px solid #ff705b;border-radius:8px;padding:9px;text-decoration:none">← Volver a SHOWROOM</a><a href="/" style="color:#fff;border:1px solid #ff705b;border-radius:8px;padding:9px;text-decoration:none">⌂ Inicio COTINUSA</a></div><h1>${pageNames[S.page]}</h1></div><span class="chip">● V5 · PETRÓLEO + CORAL</span></header>${views[S.page]()}${S.notice?`<div class="notice" style="margin-top:15px">${esc(S.notice)}</div>`:''}</main><nav class="mobile">${nav.filter(x=>['tpv','tables','kitchen','voice','connect'].includes(x[0])).map(([id,ic,t])=>`<button class="${S.page===id?'active':''}" onclick="go('${id}')">${ic}<br>${t}</button>`).join('')}</nav></div>`}render();
</script><script>
// V4: all changes below are local demonstration state, never Supabase writes.
const TABLE_COUNT=20;
const T={mode:'plan',editing:false,drag:null,positions:Array.from({length:20},(_,i)=>({x:5+(i%5)*19,y:8+Math.floor(i/5)*22})),reserved:new Set([3,12]),billRequests:new Set(),paid:new Set(),split:{},selected:5};
function tableOrders(n){return S.orders.filter(o=>o.type==='Mesa'&&o.table===n&&!o.allergy&&!T.paid.has(o.id))}
function tableAmount(n){return tableOrders(n).reduce((a,o)=>a+o.total,0)}
function tableState(n){if(T.billRequests.has(n)&&tableOrders(n).length)return 'Cobro';if(tableOrders(n).length)return 'Ocupada';if(T.reserved.has(n))return 'Reservada';return 'Libre'}
function stateClass(v){return ({Libre:'free',Ocupada:'busy',Cobro:'bill',Reservada:'reserved'})[v]||'free'}
function pickTable(n){T.selected=n;S.table=n;render()}
function setTable(n){pickTable(n)}
function setTableMode(mode){T.mode=mode;render()}
function toggleEdit(){T.editing=!T.editing;render()}
function reserveTable(n){if(tableOrders(n).length)return;T.reserved.has(n)?T.reserved.delete(n):T.reserved.add(n);render()}
function requestBill(n){if(!tableOrders(n).length)return;T.billRequests.has(n)?T.billRequests.delete(n):T.billRequests.add(n);render()}
function markPaid(n){if(!tableOrders(n).length||!T.billRequests.has(n))return; if(!confirm('SIMULACIÓN: ¿marcar la cuenta de mesa '+n+' como cobrada? No se realizará ningún cobro real.'))return;tableOrders(n).forEach(o=>T.paid.add(o.id));T.billRequests.delete(n);S.notice='Cuenta marcada como cobrada solo en esta demostración. No se ha procesado ningún pago.';render()}
function splitBill(n){const total=tableAmount(n);if(!total)return;const count=Number(T.split[n]||2);if(count<2||count>20)return;const cents=Math.round(total*100);const base=Math.floor(cents/count),extra=cents%count;const vals=Array.from({length:count},(_,i)=>(base+(i<extra?1:0))/100);S.notice='División simulada mesa '+n+': '+vals.map((v,i)=>'Persona '+(i+1)+': '+eur(v)).join(' · ')+'. No se ha cobrado nada.';render()}
function appendToTable(n){S.service='Mesa';S.table=n;T.selected=n;S.page='tpv';S.notice='Añade productos para la mesa '+n+'. Se generará una nueva comanda adicional en la demostración.';render()}
function tableButton(n){const st=tableState(n);return `<button class="table-card ${stateClass(st)} ${T.selected===n?'selected':''}" onclick="pickTable(${n})"><strong>M${n}</strong><span>${st==='Cobro'?'Cuenta pendiente':st}</span>${tableAmount(n)?`<b>${eur(tableAmount(n))}</b>`:''}</button>`}
function roomMap(){return `<div class="room" id="room" aria-label="Plano de sala editable">${Array.from({length:20},(_,i)=>{const n=i+1,p=T.positions[i],st=tableState(n);return `<button class="room-table ${stateClass(st)} ${T.selected===n?'selected':''}" style="left:${p.x}%;top:${p.y}%" onpointerdown="startDrag(event,${n})" onclick="pickTable(${n})" title="Mesa ${n}: ${st}"><b>${n}</b><small>${st}</small></button>`}).join('')}<div class="room-label">SALA · PLANO DEMO</div></div>`}
function startDrag(ev,n){if(!T.editing)return;ev.preventDefault();const el=ev.currentTarget,room=document.getElementById('room');const move=e=>{const rect=room.getBoundingClientRect();T.positions[n-1]={x:Math.max(1,Math.min(85,(e.clientX-rect.left)/rect.width*100-5)),y:Math.max(2,Math.min(86,(e.clientY-rect.top)/rect.height*100-5))};el.style.left=T.positions[n-1].x+'%';el.style.top=T.positions[n-1].y+'%'};const stop=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',stop);pickTable(n)};window.addEventListener('pointermove',move);window.addEventListener('pointerup',stop)}
function tableDetails(){const n=T.selected,st=tableState(n),orders=tableOrders(n);return `<section class="panel"><div class="row between"><h2>Mesa ${n}</h2><span class="tag ${st==='Cobro'?'coral':''}">${st}</span></div><p class="sub">${orders.length} comanda(s) abierta(s). Cambios locales de demostración.</p>${orders.length?orders.map(o=>`<div class="ticket"><b>${esc(o.id)}</b> <span class="tag">${esc(o.status)}</span>${o.items.map(i=>`<p>${i.qty} × ${esc(i.name)}</p>`).join('')}<strong>${eur(o.total)}</strong></div>`).join(''):'<div class="empty">Sin comandas abiertas</div>'}<div class="total"><span>Cuenta abierta</span><span class="price">${eur(tableAmount(n))}</span></div><div class="stack"><button class="btn" onclick="appendToTable(${n})">＋ Añadir productos a mesa ${n}</button>${orders.length?`<button class="btn alt" onclick="requestBill(${n})">${T.billRequests.has(n)?'Cancelar solicitud de cuenta':'Solicitar cuenta'}</button><div class="row"><label class="field" style="flex:1">Dividir entre<select onchange="T.split[${n}]=Number(this.value)">${Array.from({length:9},(_,i)=>i+2).map(k=>`<option value="${k}" ${Number(T.split[n]||2)===k?'selected':''}>${k} personas</option>`).join('')}</select></label><button class="btn alt" onclick="splitBill(${n})">Calcular división</button></div>${T.billRequests.has(n)?'<button class="btn warn" onclick="markPaid('+n+')">Marcar como cobrada (SIMULADO)</button>':''}`:`<button class="btn alt" onclick="reserveTable(${n})">${T.reserved.has(n)?'Quitar reserva de prueba':'Reservar mesa (demo)'}</button>`}</div><p class="sub">Sin cobros reales ni registros en Supabase. La división de cuenta es un cálculo informativo.</p></section>`}
function tablesView(){return `<div class="stats">${['Libre','Ocupada','Cobro','Reservada'].map(st=>stat(st==='Cobro'?'Pendientes de cobro':st,Array.from({length:20},(_,i)=>i+1).filter(n=>tableState(n)===st).length)).join('')}</div><div class="row between" style="margin-bottom:15px"><div class="tabs" style="margin:0"><button class="${T.mode==='plan'?'active':''}" onclick="setTableMode('plan')">▧ Plano visual</button><button class="${T.mode==='grid'?'active':''}" onclick="setTableMode('grid')">▦ Cuadrícula</button></div>${T.mode==='plan'?`<button class="btn alt" onclick="toggleEdit()">${T.editing?'✓ Terminar edición':'✥ Mover mesas'}</button>`:''}</div><div class="grid"><section class="panel"><h2>${T.mode==='plan'?'Plano editable de sala':'20 mesas numeradas'}</h2><div class="legend"><span>● Libre</span><span>● Ocupada</span><span>● Cuenta</span><span>● Reservada</span></div>${T.mode==='plan'?roomMap():`<div class="table-grid">${Array.from({length:20},(_,i)=>tableButton(i+1)).join('')}</div>`}<p class="sub">${T.editing?'Arrastra las mesas con el dedo o el ratón.':'Selecciona una mesa para abrir su cuenta. En modo plano puedes recolocarlas.'} La distribución se reinicia al recargar.</p></section>${tableDetails()}</div>`}
// V4 keeps the original POS functions and adds a visible room-access shortcut.
const originalTpv=tpv;
tpv=function(){return `<div class="row between" style="margin-bottom:14px"><span class="tag">Mesa seleccionada: ${S.table} · ${tableState(S.table)}</span><button class="btn alt sm" onclick="go('tables')">▧ Ver plano / cuentas</button></div>`+originalTpv()};
// Extend home navigation without changing existing demo order logic.
const originalHome=home;
home=function(){return `<div class="notice" style="margin-bottom:14px">PATRON V5 · 20 mesas · Plano visual y cuadrícula · Cuentas simuladas. <button class="btn alt sm" onclick="go('tables')">Abrir gestión de sala</button></div>`+originalHome()};
// Make kitchen ticket status transitions independent of simulated payment status.
render();
</script>
<script>
// V5: persistence limited to DEMO state. Never persist Supabase credentials or tokens.
(function(){
 const KEY='patron-tablet-v5-demo-1';
 function save(){try{localStorage.setItem(KEY,JSON.stringify({orders:S.orders,positions:T.positions,reserved:[...T.reserved],billRequests:[...T.billRequests],paid:[...T.paid],split:T.split,selected:T.selected,mode:T.mode,service:S.service,table:S.table}));}catch(e){console.warn('No se pudo guardar el estado local',e)}}
 try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);if(Array.isArray(d.orders))S.orders=d.orders.filter(o=>o&&typeof o.id==='string'&&Array.isArray(o.items));if(Array.isArray(d.positions)&&d.positions.length===20)T.positions=d.positions.map(p=>({x:Math.max(1,Math.min(85,Number(p.x)||1)),y:Math.max(2,Math.min(86,Number(p.y)||2))}));T.reserved=new Set((d.reserved||[]).filter(n=>Number.isInteger(n)&&n>=1&&n<=20));T.billRequests=new Set((d.billRequests||[]).filter(n=>Number.isInteger(n)&&n>=1&&n<=20));T.paid=new Set(d.paid||[]);T.split=d.split||{};T.selected=Number(d.selected)||5;T.mode=d.mode==='grid'?'grid':'plan';S.service=['Mesa','Recogida','Domicilio'].includes(d.service)?d.service:'Mesa';S.table=Number(d.table)||1;}}catch(e){console.warn('No se pudo recuperar el estado local',e)}
 const oldRender=render;
 render=function(){oldRender();save()};
 // Save drag coordinates when the pointer is released (drag updates without render until release).
 window.addEventListener('pagehide',save);
 window.patronExport=function(){const data=localStorage.getItem(KEY)||'{}';const blob=new Blob([data],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='PATRON_V5_copia_demo.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
 window.patronImport=function(input){const file=input.files&&input.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.orders)||!Array.isArray(d.positions)||d.positions.length!==20)throw Error('Formato no válido');localStorage.setItem(KEY,JSON.stringify(d));location.reload()}catch(e){alert('No se pudo importar la copia: '+e.message)}};r.readAsText(file)};
 const previousTables=tablesView;
 tablesView=function(){return '<div class="row" style="margin-bottom:14px"><button class="btn alt sm" onclick="patronExport()">↓ Exportar copia demo</button><label class="btn alt sm" style="cursor:pointer">↑ Importar copia demo<input type="file" accept=".json,application/json" onchange="patronImport(this)" hidden></label><span class="tag green">Guardado local automático</span></div>'+previousTables()};
 S.notice='V5 activa: los datos DEMO se guardan en este navegador. No se realizan cobros ni escrituras en Supabase.';
 render();
})();
</script></body></html>
